steps:
  - name: copy_file
    image: alpine
    volumes:
      - /games:/games:rw
    commands:
      - cp ./bombexpert.lua /games
  - name: update_catalog
    image: alpine
    environment:
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - apk add --no-cache curl
      - curl https://games.vps.teletype.hu/update?secret=$UPDATE_SECRET
